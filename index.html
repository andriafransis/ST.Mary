<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#7a1c24" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- تثبيت التطبيق على الموبايل -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="السيدة العذراء" />

    <link rel="icon" type="image/png" sizes="32x32" href="/ST.Mary/favicon-32x32.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ST.Mary/apple-touch-icon.png?v=4" />

    <!-- الخط: تحميل مبكر بدون ما يعطّل ظهور الصفحة -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" />

    <title>كنيسه السيدة العذراء مريم بالمطرية</title>
    <meta name="description" content="خدمات الكنيسة و مواعيد القداسات و الاعترافات" />

    <!-- معاينة الرابط في واتساب والمنصات -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="كنيسه السيدة العذراء مريم بالمطرية" />
    <meta property="og:description" content="خدمات الكنيسة و مواعيد القداسات و الاعترافات" />
    <meta property="og:image" content="https://andriafransis.github.io/ST.Mary/icon-512.png?v=4" />

    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="https://andriafransis.github.io/ST.Mary/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="كنيسه السيدة العذراء مريم بالمطرية" />
    <meta name="twitter:description" content="خدمات الكنيسة و مواعيد القداسات و الاعترافات" />
    <meta name="twitter:image" content="https://andriafransis.github.io/ST.Mary/icon-512.png?v=4" />

    <style>
      /* شاشة تحميل خفيفة تظهر لحد ما التطبيق يشتغل */
      #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6f4ef;color:#7a1c24;font-family:system-ui,Tahoma,sans-serif;font-weight:700;z-index:0}
      #boot-splash .cross{font-size:44px;line-height:1}
      #boot-splash .bar{width:120px;height:4px;border-radius:4px;background:#e8dcd8;overflow:hidden}
      #boot-splash .bar::after{content:"";display:block;width:40%;height:100%;border-radius:4px;background:#7a1c24;animation:boot 1.1s ease-in-out infinite}
      @keyframes boot{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash"><div class="cross">✝</div><div>كنيسة السيدة العذراء بالمطرية</div><div class="bar"></div></div>
    </div>
    <noscript>لازم تفعّل JavaScript عشان التطبيق يشتغل.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
